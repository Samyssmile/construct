name: 🐛 Bug Report
description: Report a problem with a public Construct contract or package surface
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill out the sections below.
  - type: input
    id: component
    attributes:
      label: Affected Contract / Area
      description: Which component, behavior, token, theme, font, or package API is affected?
      placeholder: e.g. ct-button, createModalController, color tokens, construct-theme
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Package Area
      description: Which public contract owns the problem?
      options:
        - Component styles / standalone CSS
        - Headless behavior controller
        - Design token / generated output
        - Theme compiler / custom theme
        - Foundations / fonts
        - Documentation / Storybook
        - Build / package export
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal HTML/CSS/JS or theme JSON, or a link (CodeSandbox/StackBlitz) that reproduces the issue.
      placeholder: |
        1. Use markup '...'
        2. Apply theme '...'
        3. See '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      description: Does it happen in a specific theme?
      options:
        - light
        - dark
        - high-contrast
        - custom theme
        - system preference (no explicit theme)
        - all themes
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Package Version
      placeholder: "@neuravision/construct@2.3.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS
      placeholder: "Chrome 130 on Windows 11"
    validations:
      required: false
  - type: dropdown
    id: input_method
    attributes:
      label: Input Method
      description: Which input method reproduces the issue?
      options:
        - Keyboard
        - Mouse / fine pointer
        - Touch / coarse pointer
        - Voice input
        - Not input-specific
    validations:
      required: false
  - type: input
    id: assistive_technology
    attributes:
      label: Assistive Technology
      description: Include product and version when applicable.
      placeholder: "NVDA 2026.1 with Firefox, or none"
    validations:
      required: false
  - type: checkboxes
    id: a11y
    attributes:
      label: Accessibility
      options:
        - label: This bug affects accessibility (keyboard, screen reader, contrast)
        - label: This bug reproduces with forced-colors active
